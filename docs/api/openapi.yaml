    GeographicAlert:
      type: object
      required:
        - id
        - title
        - hazard_description
        - center
        - radius_m
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        hazard_description:
          type: string
        center:
          $ref: "#/components/schemas/GeoPoint"
        radius_m:
          type: integer
        created_by:
          $ref: "#/components/schemas/StaffRef"
        created_at:
          type: string
          format: date-time
    GeographicAlertCreated:

        - id
        - assignment_id
        - authority
        - created_at
      properties:
        id:
          type: integer
          format: int64
        assignment_id:
          type: string
          format: uuid
        authority:
          type: string
        request_payload:
          type:
            - object
            - "null"
        response_payload:

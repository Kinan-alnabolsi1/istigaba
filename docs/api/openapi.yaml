      properties:
        id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        submitted_by:
          $ref: "#/components/schemas/StaffRef"
        action_taken:
          type: string
        attachment_download_url:
          type:
            - string
            - "null"
          format: uri
        submitted_at:
          type: string
          format: date-time
    SubmitFieldActionRequest:
      type: object
      required:
        - action_taken
      properties:
        action_taken:
          type: string
          minLength: 1
        attachment:
          type: string
          format: binary
          description: Single optional file (ERD has one `attachment_url`).
    ChatMessageCitizen:
      type: object
      required:

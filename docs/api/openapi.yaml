        field_unit_id:
          type: integer
    ReassignReportRequest:
      type: object
      required:
        - field_unit_id
      additionalProperties: false
      properties:
        field_unit_id:
          type: integer
          description: Must differ from the unit of the active assignment.
        note:
          type: string
          description: Optional; stored in `report_timeline.note` and the audit log (no assignment column exists for it).
    Assignment:
      type: object
      description: Assignment record (operator/admin view).
      required:
        - id
        - report_id
        - field_unit
        - assigned_by
        - mission_status
        - assigned_at
        - is_active
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        field_unit:
          $ref: "#/components/schemas/UnitRef"
        assigned_by:
          $ref: "#/components/schemas/StaffRef"
        mission_status:
          $ref: "#/components/schemas/MissionStatus"
        is_active:
          type: boolean
          description: Derived - `mission_status != cancelled`. At most one assignment per report is active.
        assigned_at:
          type: string
          format: date-time
        en_route_at:
          type:
            - string
            - "null"
          format: date-time
        on_site_at:
          type:
            - string
            - "null"
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
    AssignmentResult:
      type: object
      required:
        - assignment
        - report_status
      properties:
        assignment:
          $ref: "#/components/schemas/Assignment"

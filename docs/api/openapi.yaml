  /report-types:
    get:
      tags:
        - Report Types
      operationId: listReportTypes
      summary: "[FR-008] List report categories and types"
      description: |-
        Returns the types grouped by `category` with the suggested responsible authority. The seeded type "SOS عام" exists for SOS reports only. **D-25 (approved):** it is excluded programmatically (by its seeded name, no schema change) when `purpose=manual_report` (the default), which is what the citizen app uses for manual report creation. `purpose=all` (Dispatcher and System Administrator only; others get 403) returns every type, for filters and display of SOS reports.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: Citizen, Dispatcher, Field Unit Representative, System Administrator.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - Citizen
        - Dispatcher
        - Field Unit Representative
        - System Administrator
      x-required-permissions: []
      x-fr:
        - FR-008
      x-entities:
        - report_types
      x-mechanism: endpoint
      parameters:
        - name: purpose
          in: query
          required: false
          description: manual_report excludes the SOS type; all includes it (Dispatcher and System Administrator only).
          schema:
            type: string
            enum:
              - manual_report
              - all
            default: manual_report
      responses:
        "200":
          description: Report types.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReportType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /settings/public:
    get:
      tags:
        - System Settings
      operationId: getPublicSettings
      summary: "[FR-006, FR-036] Get the client-visible settings"
      description: |-
        Exposes only the whitelisted keys the apps need, chiefly the SOS cancellation countdown.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: Citizen, Dispatcher, Field Unit Representative, System Administrator.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - Citizen
        - Dispatcher
        - Field Unit Representative
        - System Administrator
      x-required-permissions: []
      x-fr:
        - FR-006
        - FR-036
      x-entities:
        - system_settings
      x-mechanism: endpoint
      responses:
        "200":
          description: Public settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived access token (JWT) issued by `POST /auth/login` and `POST /auth/refresh` (NFR-006).
        **Authentication** only proves *who* the caller is. **Authorization** (role, permission,
        ownership, state checks) is enforced separately on the backend for every operation
        (NFR-007) and is documented per operation through the `x-*` extensions.
        Token lifetime values are NOT defined by the SRS (see API_DESIGN_DECISIONS.md, D-05).
  parameters:
    PageParam:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: per_page
      in: query
      description: Page size. Maximum value is a proposed default (D-27).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    ReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentIdPath:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftIdPath:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AlertIdPath:
      name: alertId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationIdPath:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleIdPath:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
    FieldUnitIdPath:
      name: fieldUnitId
      in: path
      required: true
      schema:
        type: integer
    ReportTypeIdPath:
      name: reportTypeId
      in: path
      required: true
      schema:
        type: integer
    SettingKeyPath:
      name: key
      in: path
      required: true
      schema:
        type: string
        maxLength: 100
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated UUID identifying one logical submission. A repeated request with the same
        key from the same user returns the original result and never creates a second report.
        Retention window of keys is an application-level (cache) setting, not stored in the ERD (D-10).
      schema:
        type: string
        format: uuid
    FromParam:
      name: from
      in: query
      description: Inclusive lower bound (UTC).
      schema:
        type: string
        format: date-time
    ToParam:
      name: to
      in: query
      description: Inclusive upper bound (UTC).
      schema:
        type: string
        format: date-time
    ReportStatusFilter:
      name: status
      in: query
      description: Filter by `reports.current_status`. Repeat or comma-separate for several values.
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ReportStatus"
  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description:
        400 - Malformed request (unparseable JSON, wrong content type, malformed query string). Not used for field
        validation failures (see 422).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: malformed_request
            message: Request body is not valid JSON.
            request_id: req_01
    Unauthorized:
      description: 401 - Missing, expired, malformed, or revoked credentials, or the account is deactivated.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Authentication is required.
            request_id: req_01
    Forbidden:
      description: |
        403 - Authenticated but not allowed: wrong role, missing permission, or an ownership rule failed
        where revealing the resource's existence is not a concern. For resources that belong to another
        user the API returns 404 instead (anti-enumeration).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: forbidden
            message: You are not allowed to perform this action.
            request_id: req_01
    NotFound:
      description: 404 - Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: not_found
            message: Resource not found.
            request_id: req_01
    Conflict:
      description: |
        409 - The request is valid but conflicts with current resource state: invalid state transition,
        concurrent/duplicate assignment, duplicate operation, closed report, etc.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: invalid_state_transition
            message: Report cannot move from 'received' to 'assigned'.
            request_id: req_01
    ValidationFailed:
      description: 422 - Field-level validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          example:
            code: validation_failed
            message: The given data was invalid.
            request_id: req_01
            errors:
              close_reason:
                - The close reason field is required.
    TooManyRequests:
      description: 429 - Rate limit exceeded (NFR-011).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: rate_limited
            message: Too many requests.
            request_id: req_01
    InternalError:
      description:
        500 - Unexpected server error. No internal details are disclosed. All multi-table operations are rolled
        back.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: internal_error
            message: Unexpected error.
            request_id: req_01
    ServiceUnavailable:
      description:
        503 - A dependent component (speech-to-text or AI extraction) is unavailable. Clients fall back to manual
        reporting (FR-014, NFR-020).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: ai_component_unavailable
            message: The assistant is unavailable. Please submit a manual report.
            fallback: manual_report
            request_id: req_01
  schemas:
    ReportStatus:
      type: string
      description: Report lifecycle (SRS section 7, ERD `report_status`). Distinct from MissionStatus.
      enum:
        - received
        - under_review
        - assigned
        - en_route
        - on_site
        - mission_completed
        - closed
    MissionStatus:
      type: string
      description: |
        Assignment lifecycle (ERD `mission_status`). `cancelled` belongs to the ASSIGNMENT only
        (it is set on reassignment) and never means the report is cancelled.
      enum:
        - assigned
        - en_route
        - on_site
        - mission_completed
        - cancelled
    SeverityLevel:
      type: string
      enum:
        - low
        - medium
        - high
        - critical
    ReportSource:
      type: string
      enum:
        - sos
        - manual
        - ai_bot
    InputMode:
      type: string
      enum:
        - text
        - voice
    ExtractionStatus:
      type: string
      enum:
        - pending_review
        - edited
        - confirmed
        - cancelled
    NotificationType:
      type: string
      enum:
        - status_update
        - assignment
        - closure
        - geographic_alert
    UnitAvailability:
      type: string
      enum:
        - available
        - busy
        - offline
    RoleName:
      type: string
      enum:
        - Citizen
        - Dispatcher
        - Field Unit Representative
        - System Administrator
    AttachmentType:
      type: string
      description: ERD `report_attachments.file_type` is varchar(20) with the DBML note image | video | audio (confirmed).
      enum:
        - image
        - video
        - audio
    GeoPoint:
      type: object
      description:
        WGS-84 point (SRID 4326), decimal degrees. Note PostGIS stores lon/lat order; the API always uses named
        fields.
      required:
        - latitude
        - longitude
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      example:
        latitude: 33.5138
        longitude: 36.2765
    PageMeta:
      type: object
      required:
        - page
        - per_page
        - total
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        unread_count:
          type: integer
          description: Only on notification lists.
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        message:
          type: string
          description: Human-readable text. Never contains personal data of any reporter.
        request_id:
          type: string
        fallback:
          type: string
          enum:
            - manual_report
          description: Present when the client should switch to manual reporting.
    ValidationError:
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          required:
            - errors
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    ReportTypeRef:
      type: object
      required:
        - id
        - category
        - name
      properties:
        id:
          type: integer
        category:
          type: string
        name:
          type: string
    ReportType:
      type: object
      required:
        - id
        - category
        - name
        - responsible_authority
      properties:
        id:
          type: integer
        category:
          type: string
          example: الطوارئ المدنية
        name:
          type: string
          example: حريق
        responsible_authority:
          type: string
          description: Suggested authority (FR-008). Integration with it is simulated (FR-039).
          example: الدفاع المدني
    UnitRef:
      type: object
      required:
        - id
        - name
        - unit_type
      properties:
        id:
          type: integer
        name:
          type: string
        unit_type:
          type: string
    StaffRef:
      type: object
      description: Reference to a staff member (never to a citizen reporter).
      required:
        - id
        - full_name
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
    AttachmentOut:
      type: object
      description: |
        Attachment metadata. The internal storage reference (`file_url`) is never returned; `download_url`
        is a short-lived signed URL. No uploader information is included (ERD has none) so attachments
        cannot reveal an anonymous reporter. Servers SHOULD strip embedded metadata (EXIF/GPS) from
        uploads of anonymous reports (D-23).
      required:
        - id
        - file_type
        - uploaded_at
        - download_url
      properties:
        id:
          type: string
          format: uuid
        file_type:
          $ref: "#/components/schemas/AttachmentType"
        mime_type:
          type:
            - string
            - "null"
        size_bytes:
          type:
            - integer
            - "null"
          format: int64
        uploaded_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
    RegisterRequest:
      type: object
      required:
        - full_name
        - email
        - phone
        - password
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 30
        password:
          type: string
          format: password
          minLength: 8
          description: Password policy is not defined by the SRS; minLength is a proposal (D-06).
    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required:
        - refresh_token
      additionalProperties: false
      properties:
        refresh_token:
          type: string
    LogoutRequest:
      type: object
      required:
        - refresh_token
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          description: Token whose `refresh_tokens.revoked_at` is set.
    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Opaque; only its hash is stored (`refresh_tokens.token_hash`). Rotated on every refresh.
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds.
    CurrentUser:
      type: object
      description: The authenticated user's own profile. Never contains password or token hashes.
      required:
        - id
        - full_name
        - email
        - phone
        - role
        - permissions
        - is_active
        - location_consent
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
            - string
            - "null"
          description: Nullable in the ERD (unique when present).
        role:
          $ref: "#/components/schemas/RoleName"
        field_unit:
          oneOf:
            - $ref: "#/components/schemas/UnitRef"
            - type: "null"
        permissions:
          type: array
          items:
            type: string
          description: Permission codes granted to the role.
        is_active:
          type: boolean
        location_consent:
          type: boolean
        location_updated_at:
          type:
            - string
            - "null"
          format: date-time
    UpdateLocationRequest:
      type: object
      required:
        - location
      additionalProperties: false
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
    UpdateLocationConsentRequest:
      type: object
      required:
        - location_consent
      additionalProperties: false
      properties:
        location_consent:
          type: boolean
    UserAdmin:
      type: object
      description: Administrative view of a user. Excludes password hash, token data and the user's precise last known location.
      required:
        - id
        - role
        - full_name
        - email
        - phone
        - is_active
        - created_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: integer
            name:
              $ref: "#/components/schemas/RoleName"
        field_unit:
          oneOf:
            - $ref: "#/components/schemas/UnitRef"
            - type: "null"
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
            - string
            - "null"
        is_active:
          type: boolean
        location_consent:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    CreateUserRequest:
      type: object
      required:
        - role_id
        - full_name
        - email
        - password
      additionalProperties: false
      properties:
        role_id:
          type: integer
        field_unit_id:
          type:
            - integer
            - "null"
          description:
            REQUIRED when the role is Field Unit Representative; MUST be absent/null for every other role (422
            otherwise).
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - "null"
          maxLength: 30
          description: Optional for staff accounts (nullable in the ERD).
        password:
          type: string
          format: password
          minLength: 8
          description: Initial credential set by the administrator (D-07).
    UpdateUserRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        role_id:
          type: integer
          description: Changing role revokes the user's refresh tokens.
        field_unit_id:
          type:
            - integer
            - "null"
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - "null"
          maxLength: 30
    UpdateProfileRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type:
            - string
            - "null"
          maxLength: 30
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      additionalProperties: false
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          description: Same policy as registration (D-06).
    CreateFieldUnitRequest:
      type: object
      required:
        - name
        - unit_type
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 150
        unit_type:
          type: string
          maxLength: 50
          description: Police, civil defence, ambulance, traffic.
        availability:
          $ref: "#/components/schemas/UnitAvailability"
        location:
          $ref: "#/components/schemas/GeoPoint"
    UpdateFieldUnitAdminRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 150
        unit_type:
          type: string
          maxLength: 50
        availability:
          $ref: "#/components/schemas/UnitAvailability"
        location:
          $ref: "#/components/schemas/GeoPoint"
    Permission:
      type: object
      required:
        - id
        - code
      properties:
        id:
          type: integer
        code:
          type: string
          example: report.assign
        description:
          type:
            - string
            - "null"
    Role:
      type: object
      required:
        - id
        - name
        - permissions
      properties:
        id:
          type: integer
        name:
          $ref: "#/components/schemas/RoleName"
        description:
          type:
            - string
            - "null"
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    ReplaceRolePermissionsRequest:
      type: object
      required:
        - permission_ids
      additionalProperties: false
      properties:
        permission_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
          description: The complete new set (replaces `role_permissions` rows for the role).
    Setting:
      type: object
      required:
        - key
        - value
        - updated_at
      properties:
        key:
          type: string
        value:
          type: string
        description:
          type:
            - string
            - "null"
        updated_by:
          oneOf:
            - $ref: "#/components/schemas/StaffRef"
            - type: "null"
        updated_at:
          type: string
          format: date-time
    UpdateSettingRequest:
      type: object
      required:
        - value
      additionalProperties: false
      properties:
        value:
          type: string
          description: Stored as text (`system_settings.value`); per-key validation is applied by the backend.
    PublicSettings:
      type: object
      description:
        Whitelisted, non-sensitive settings the apps need (the whitelist and the key names are pending approval
        - D-12).
      properties:
        sos_cancel_timeout_seconds:
          type: integer
          description: SOS cancellation countdown in seconds. SRS default is 5 (FR-006).
    CreateReportTypeRequest:
      type: object
      required:
        - category
        - name
        - responsible_authority
      additionalProperties: false
      properties:
        category:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        responsible_authority:
          type: string
          maxLength: 100
    UpdateReportTypeRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        category:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
        responsible_authority:
          type: string
          maxLength: 100
    CitizenTimelineEntry:
      type: object
      description: Citizen-facing timeline. Internal notes and staff identities are deliberately omitted.
      required:
        - status
        - changed_at
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
        changed_at:
          type: string
          format: date-time
    CreateManualReportRequest:
      type: object
      required:
        - report_type_id
        - description
      additionalProperties: false
      properties:
        report_type_id:
          type: integer
        description:
          type: string
          minLength: 1
        location:
          $ref: "#/components/schemas/GeoPoint"
        location_text:
          type: string
          maxLength: 255
        is_anonymous:
          type: boolean
          default: false
        attachments:
          type: array
          description: Image/video/short audio files (multipart only). Count and size limits are pending approval (D-24).
          items:
            type: string
            format: binary
    CreateSosRequest:
      type: object
      additionalProperties: false
      description: |
        Sent only after the client-side cancellation countdown expires. `is_anonymous` is NOT accepted:
        sending it (even as false) is a 422 (anonymous SOS is forbidden).
      properties:
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
          description: Null/absent when the device could not obtain a location (D-09).
    CitizenReportSummary:
      type: object
      required:
        - id
        - source
        - report_type
        - is_anonymous
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/ReportSource"
        report_type:
          $ref: "#/components/schemas/ReportTypeRef"
        is_anonymous:
          type: boolean
        status:
          $ref: "#/components/schemas/ReportStatus"
        location_text:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CitizenReport:
      description:
        The reporter's own view of a report (own data only). `priority_score`, assignment and staff data are not
        exposed.
      allOf:
        - $ref: "#/components/schemas/CitizenReportSummary"
        - type: object
          required:
            - timeline
            - attachments
          properties:
            description:
              type:
                - string
                - "null"
            location:
              oneOf:
                - $ref: "#/components/schemas/GeoPoint"
                - type: "null"
            severity:
              oneOf:
                - $ref: "#/components/schemas/SeverityLevel"
                - type: "null"
            close_reason:
              type:
                - string
                - "null"
              description: Shown after closure (D-26).
            closed_at:
              type:
                - string
                - "null"
              format: date-time
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/CitizenTimelineEntry"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentOut"
    CreateAiTextDraftRequest:
      type: object
      required:
        - input_text
      additionalProperties: false
      properties:
        input_text:
          type: string
          minLength: 1
          description: Free text (Modern Standard Arabic or local dialect).
        is_anonymous:
          type: boolean
          default: false
    CreateAiAudioDraftRequest:
      type: object
      required:
        - audio
      properties:
        audio:
          type: string
          format: binary
          description: Voice message. Transcribed then deleted; never persisted (FR-018 and NFR-015).
        is_anonymous:
          type: boolean
          default: false
    UpdateAiDraftRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Citizen edits of the extracted data. A successful edit moves the draft to `edited`.
      properties:
        extracted_type_id:
          type: integer
        extracted_severity:
          $ref: "#/components/schemas/SeverityLevel"
        extracted_location_text:
          type: string
          maxLength: 255
        extracted_description:
          type: string
        is_anonymous:
          type: boolean
    ConfirmAiDraftRequest:
      type: object
      additionalProperties: false
      description: The draft has no geographic point (ERD), so the device location may be supplied here.
      properties:
        location:
          $ref: "#/components/schemas/GeoPoint"
    AiDraft:
      type: object
      description: AI extraction DRAFT. It is not a report until confirmed. No audio reference or user identifier is exposed.
      required:
        - id
        - input_mode
        - status
        - is_anonymous
        - created_at
      properties:
        id:
          type: string
          format: uuid
        input_mode:
          $ref: "#/components/schemas/InputMode"
        input_text:
          type: string
          description: Typed text or, for voice input, the transcript.
        extracted_type:
          oneOf:
            - $ref: "#/components/schemas/ReportTypeRef"
            - type: "null"
        extracted_severity:
          oneOf:
            - $ref: "#/components/schemas/SeverityLevel"
            - type: "null"
        extracted_location_text:
          type:
            - string
            - "null"
        extracted_description:
          type:
            - string
            - "null"
        is_anonymous:
          type: boolean
        status:
          $ref: "#/components/schemas/ExtractionStatus"
        report_id:
          type:
            - string
            - "null"
          format: uuid
          description: Populated only after explicit confirmation.
        confirmed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    ConfirmAiDraftResponse:
      type: object
      required:
        - draft
        - report
      properties:
        draft:
          $ref: "#/components/schemas/AiDraft"
        report:
          $ref: "#/components/schemas/CitizenReport"
    ReporterIdentified:
      type: object
      description: Reporter shown to a Dispatcher for a NON-anonymous report. Email and internal ids are never included.
      required:
        - is_anonymous
        - display_name
      properties:
        is_anonymous:
          type: boolean
          const: false
        display_name:
          type: string
        phone:
          type:
            - string
            - "null"
    ReporterAnonymous:
      type: object
      description: |
        Reporter representation for ANY anonymous report, for Dispatcher and Field Unit Representative.
        It is fixed: no id, name, phone, email, or link is ever added to it.
      required:
        - is_anonymous
        - display_name
      additionalProperties: false
      properties:
        is_anonymous:
          type: boolean
          const: true
        display_name:
          type: string
          const: Anonymous Reporter
    OperationsReporter:
      oneOf:
        - $ref: "#/components/schemas/ReporterIdentified"
        - $ref: "#/components/schemas/ReporterAnonymous"
      discriminator:
        propertyName: is_anonymous
    FieldReporter:
      oneOf:
        - type: object
          description: Minimal reporter data for field units (D-19).
          required:
            - is_anonymous
            - display_name
          properties:
            is_anonymous:
              type: boolean
              const: false
            display_name:
              type: string
        - $ref: "#/components/schemas/ReporterAnonymous"
    OperationsReportSummary:
      type: object
      required:
        - id
        - source
        - report_type
        - severity
        - status
        - reporter
        - created_at
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: "#/components/schemas/ReportSource"
        report_type:
          $ref: "#/components/schemas/ReportTypeRef"
        reporter:
          $ref: "#/components/schemas/OperationsReporter"
        severity:
          oneOf:
            - $ref: "#/components/schemas/SeverityLevel"
            - type: "null"
          description: SOS reports are created with `critical` (D-11).
        priority_score:
          type:
            - number
            - "null"
          description:
            Advisory ordering value only; never replaces the dispatcher's decision (FR-022). Algorithm undefined
            (D-11).
        status:
          $ref: "#/components/schemas/ReportStatus"
        administrative_area:
          type:
            - string
            - "null"
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        location_text:
          type:
            - string
            - "null"
        waiting_seconds:
          type: integer
          description: Time since creation while not closed.
        created_at:
          type: string
          format: date-time
    OperationsTimelineEntry:
      type: object
      required:
        - status
        - changed_at
        - changed_by_role
      properties:
        status:
          $ref: "#/components/schemas/ReportStatus"
        changed_at:
          type: string
          format: date-time
        changed_by_role:
          type: string
          enum:
            - system
            - Dispatcher
            - Field Unit Representative
            - System Administrator
        changed_by:
          oneOf:
            - $ref: "#/components/schemas/StaffRef"
            - type: "null"
          description: Staff only. Always null when the actor is the system.
        note:
          type:
            - string
            - "null"
    OperationsAiExtraction:
      type: object
      description:
        AI-extracted data shown to operators (FR-023). The original input text and audio are not exposed because
        free text may self-identify an anonymous reporter (D-22).
      properties:
        input_mode:
          $ref: "#/components/schemas/InputMode"
        extracted_type:
          oneOf:
            - $ref: "#/components/schemas/ReportTypeRef"
            - type: "null"
        extracted_severity:
          oneOf:
            - $ref: "#/components/schemas/SeverityLevel"
            - type: "null"
        extracted_location_text:
          type:
            - string
            - "null"
        extracted_description:
          type:
            - string
            - "null"
    AssignmentRef:
      type: object
      required:
        - id
        - field_unit
        - mission_status
      properties:
        id:
          type: string
          format: uuid
        field_unit:
          $ref: "#/components/schemas/UnitRef"
        mission_status:
          $ref: "#/components/schemas/MissionStatus"
    OperationsReport:
      description: Full operator view. Contains no reporter id/name/email for anonymous reports, in any nested object.
      allOf:
        - $ref: "#/components/schemas/OperationsReportSummary"
        - type: object
          required:
            - timeline
            - attachments
          properties:
            description:
              type:
                - string
                - "null"
            close_reason:
              type:
                - string
                - "null"
            closed_by:
              oneOf:
                - $ref: "#/components/schemas/StaffRef"
                - type: "null"
            closed_at:
              type:
                - string
                - "null"
              format: date-time
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/OperationsTimelineEntry"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentOut"
            ai_extraction:
              oneOf:
                - $ref: "#/components/schemas/OperationsAiExtraction"
                - type: "null"
            active_assignment:
              oneOf:
                - $ref: "#/components/schemas/AssignmentRef"
                - type: "null"
            updated_at:
              type: string
              format: date-time
    MapReportPoint:
      type: object
      required:
        - id
        - report_type
        - severity
        - status
        - location
      properties:
        id:
          type: string
          format: uuid
        report_type:
          $ref: "#/components/schemas/ReportTypeRef"
        severity:

          type:
            - string
            - "null"
        old_value:
          type:
            - object
            - "null"
        new_value:
          type:
            - object
            - "null"
        reason:
          type:
            - string
            - "null"
        ip_address:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
    RevealIdentityRequest:
      type: object
      required:
        - reason
      additionalProperties: false

            - attachments
          properties:
            en_route_at:
              type:
                - string
                - "null"
              format: date-time
            on_site_at:
              type:
                - string
                - "null"
              format: date-time
            completed_at:
              type:
                - string
                - "null"
              format: date-time
            cancelled_at:
              type:
                - string
                - "null"
              format: date-time
            reporter:
              $ref: "#/components/schemas/FieldReporter"
            description:
              type:
                - string
                - "null"
            attachments:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentOut"
    MissionUpdateResult:
      type: object
      required:
        - assignment
        - report_status
      properties:
        assignment:
          $ref: "#/components/schemas/FieldAssignmentSummary"
        report_status:
          $ref: "#/components/schemas/ReportStatus"
    UpdateFieldUnitRequest:
      type: object
      minProperties: 1

              format: date-time
            to:
              type: string
              format: date-time
        total_reports:
          type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        by_category:
          type: object
          additionalProperties:
            type: integer
        by_severity:
          type: object
          additionalProperties:
            type: integer
        by_source:
          type: object
          additionalProperties:
            type: integer
        avg_response_time_seconds:

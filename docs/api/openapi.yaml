    AreaAlert:
      type: object
      required:
        - id
        - title
        - hazard_description
        - center
        - radius_m
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        hazard_description:
          type: string
        center:
          $ref: "#/components/schemas/GeoPoint"
        radius_m:
          type: integer
        created_at:
          type: string
          format: date-time
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - is_read
        - created_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        report_id:
          type:
            - string
            - "null"
          format: uuid
        alert_id:
          type:
            - string
            - "null"
          format: uuid
        title:
          type: string
        body:
          type:
            - string
            - "null"
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time
    StatisticsOverview:

      additionalProperties: false
      properties:
        close_reason:
          type: string
          minLength: 1
          description: Mandatory (for example false report; duplicate; cancelled; resolved). Whitespace-only is rejected.
    FieldUnit:
      type: object
      required:
        - id
        - name
        - unit_type
        - availability
      properties:
        id:
          type: integer
        name:
          type: string
        unit_type:
          type: string
        availability:
          $ref: "#/components/schemas/UnitAvailability"
        location:
          oneOf:
            - $ref: "#/components/schemas/GeoPoint"
            - type: "null"
        location_updated_at:
          type:
            - string
            - "null"

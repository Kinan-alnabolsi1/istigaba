      operationId: createSosReport
      summary: "[FR-006] Create an SOS report (after the cancellation countdown)"
      description: |-
        The cancellation window is a client-side countdown whose length comes from `getPublicSettings` (default 5 s). **No report exists during the countdown, so there is nothing to cancel on the server**; the client simply does not call this endpoint if the user cancels (D-09). This call creates the report with `source = sos`, the seeded type "SOS عام", `is_anonymous = false` and **`severity = critical` set automatically** (D-11, approved). Any `is_anonymous` field in the body is rejected (422 `anonymous_sos_not_allowed`). Idempotent through the required `Idempotency-Key` header: a replay returns the original report with 200.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: Citizen.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        - report_id
        - sender_role
        - is_mine
        - message
        - sent_at
      properties:
        id:
          type: integer
          format: int64
        report_id:
          type: string
          format: uuid
        sender_role:
          type: string
          enum:
            - citizen
            - operations_room

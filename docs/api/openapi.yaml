      operationId: reassignReport
      summary: "[FR-026] Reassign a report to another field unit"
      description: |-
        Not an SRS FR; required by ERD v1.1 (`assignments.cancelled_at`, partial unique index) - see D-02. One transaction with the report row locked: (1) load the active assignment A, (2) set A `mission_status = cancelled` and `cancelled_at`, keeping A as history, (3) insert assignment B (`assigned`), (4) set report status `assigned` (permitted regression from `en_route`/`on_site`, D-01), (5) timeline row with the note, (6) notifications to the old unit, the new unit and the reporter, (7) audit. Allowed only while the report is `assigned`, `en_route` or `on_site`; otherwise 409. Target unit must differ from the current one.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: Dispatcher.
        - Required permission codes (checked against `role_permissions`): `report.assign`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        **State synchronisation**
        - Cancel A and create B are atomic; at no instant are there zero or two active assignments committed.
      x-required-roles:
        - Dispatcher
      x-required-permissions:
        - report.assign
      x-fr:
        - FR-026
      x-nfr:
        - NFR-010
      x-entities:

            id:
              type: string
              format: uuid
            full_name:
              type: string
            email:
              type: string
              format: email
            phone:
              type:
                - string
                - "null"
        revealed_at:
          type: string
          format: date-time
        audit_log_id:
          type: integer
          format: int64

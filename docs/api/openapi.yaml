openapi: 3.1.0
info:
  title: Istigaba Emergency Response Platform API
  version: 1.0.0
  summary: REST contract for the Istigaba platform (SRS v1.1 / ERD v1.1).
  description: |
    API CONTRACT v1.0.0 (approved decisions D-01 to D-38 applied) for the Istigaba (استجابة) emergency reporting and response platform.
    Derived from SRS v1.1, ERD v1.1 and the ERD v1.1 explanation. Verified against the DBML. Operations tagged `x-proposed` are not SRS requirements.

    ## Conventions
    - **Style**: RESTful JSON over HTTPS. Base path `/api/v1`. Resources are named after business concepts, not tables.
    - **Audience-scoped paths**: `/me/...` (Citizen), `/operations/...` (Dispatcher), `/field/...` (Field Unit Representative), `/admin/...` (System Administrator). Different audiences receive **different response schemas** so privacy is enforced by the contract itself.
    - **Identifiers**: UUID v4 strings for `users`, `reports`, `assignments`, `ai_extractions`, `field_actions`, `geographic_alerts`, `notifications`, `report_attachments`; integers for `roles`, `permissions`, `report_types`, `field_units`, `chat_messages`, `audit_logs`.
    - **Timestamps**: RFC 3339 `date-time`, always UTC (`Z`).
    - **Coordinates**: object `{latitude, longitude}`, WGS-84 degrees; distances in metres (`radius_m`).
    - **Enums**: lowercase `snake_case` exactly as in the ERD. Report statuses and mission statuses are separate enums.
    - **Pagination**: `page` (1-based) and `per_page`; lists return `{data, meta:{page, per_page, total}}`. Single resources are returned unwrapped.
    - **Filtering / sorting**: filters are query parameters named after the field; `sort` accepts a documented enum, `-` prefix = descending.
    - **Errors**: `{code, message, request_id}`; validation errors add `errors: {field: [messages]}`. 400 malformed, 401 unauthenticated, 403 forbidden, 404 not found (also used to hide other users' resources), 409 state conflict / duplicate, 422 validation, 429 rate limited, 500 internal, 503 AI component unavailable.
    - **Idempotency**: `POST /me/reports/sos` requires `Idempotency-Key`; `POST /me/ai-drafts/{draftId}/confirm` is naturally idempotent.
    - **Rate limiting**: operations flagged `x-rate-limited` return 429 with `Retry-After` (NFR-011). Numeric limits are pending approval.
    - **Real-time**: WebSocket events are NOT part of this REST contract; see `REALTIME_EVENTS.md`.

    ## Authorisation extensions
    | Extension | Meaning |
    |---|---|
    | `x-required-roles` | Roles allowed to call the operation (exact SRS role names). Absent on public operations. |
    | `x-required-permissions` | Permission codes checked against `role_permissions`. Approved by decision D-34: the three codes defined in the sources (`report.assign`, `report.close`, `identity.reveal`) plus the proposed codes now promoted to required, and `field_unit.manage` (D-37). All must be seeded. |
    | `x-ownership` | Resource-ownership rule enforced in addition to role/permission. Violations return 404. |
    | `x-fr` / `x-nfr` | Related requirement identifiers (traceability). |
    | `x-entities` | ERD entities read or written. |
    | `x-mechanism` | `endpoint`, or the combination of mechanisms that fulfil the requirement. |
    | `x-rate-limited` | Subject to NFR-011 rate limiting. |
    | `x-proposed` | Optional operation not required by the SRS. |

    **Authentication** establishes identity (valid, unexpired, non-revoked token, active account). **Authorisation** decides what that identity may do (role, permission, ownership, state) and is always enforced server-side.

    ## Anonymous reports
    `reports.reporter_id` is always stored. Anonymity is applied by the API layer: Dispatcher and Field Unit Representative schemas contain a fixed `ReporterAnonymous` object and never a reporter id, name, phone, email, or any link to the user. Only `revealAnonymousReporterIdentity` returns identity, and it is audited.
  contact:
    name: Istigaba API design (draft)
servers:
  - url: "{scheme}://{host}/api/v1"
    description: Configurable server
    variables:
      scheme:
        default: https
        enum:
          - https
      host:
        default: api.istigaba.example
        description: Deployment host.
tags:
  - name: Authentication
    description: Login, token refresh, logout (FR-001..FR-003).
  - name: Current User
    description: Own profile and own location/consent.
  - name: User Management
    description: Administrator user management (FR-034).
  - name: Roles and Permissions
    description: RBAC administration (FR-004).
  - name: System Settings
    description: System settings (FR-036).
  - name: Report Types
    description: Report categories and types (FR-008).
  - name: Citizen Reporting
    description: Manual reporting and tracking (FR-007..FR-010).
  - name: SOS Reporting
    description: SOS reporting (FR-006).
  - name: AI-Assisted Reporting
    description: AI draft lifecycle (FR-013..FR-018).
  - name: Notifications
    description: In-app notifications (FR-011, FR-038).
  - name: Geographic Alerts
    description: Geographic alerts (FR-012, FR-027).
  - name: Live Chat
    description: Chat between operators and reporters (FR-025).
  - name: Operations Room
    description: Operations room reports (FR-019..FR-024, FR-028).
  - name: Assignments and Field Units
    description: Field units and assignments (FR-021, FR-026).
  - name: Field Actions
    description: Field action reports (FR-033).
  - name: Field Unit Module
    description: Field unit application (FR-031, FR-032).
  - name: Statistics and Export
    description: Statistics and export (FR-029, FR-030).
  - name: Audit Logs
    description: Audit logs (FR-035).
  - name: Anonymous Identity Disclosure
    description: Protected identity disclosure (FR-037).
  - name: Simulated Integration
    description: Simulated authority integration (FR-039).
security:
  - bearerAuth: []
paths:
  /admin/audit-logs:
    get:
      tags:
        - Audit Logs
      operationId: listAuditLogs
      summary: "[FR-035, FR-024, FR-034, FR-036, FR-037] Search the audit log (read-only)"
      description: |-
        Read-only. Rows are written by the backend only (reports, assignments, closures, user and role changes, settings, geographic alerts, identity disclosure). Identity-reveal rows record actor, report, time and reason; the revealed identity itself is not copied into `new_value`.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `audit.view`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - audit.view
      x-fr:
        - FR-035
        - FR-024
        - FR-034
        - FR-036
        - FR-037
      x-nfr:
        - NFR-010
      x-entities:
        - audit_logs
        - users
      x-mechanism: endpoint
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Acting user.
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          description: e.g. identity.reveal, report.close.
          schema:
            type: string
        - name: entity_type
          in: query
          required: false
          description: Entity type.
          schema:
            type: string
        - name: entity_id
          in: query
          required: false
          description: Entity id.
          schema:
            type: string
        - $ref: "#/components/parameters/FromParam"
        - $ref: "#/components/parameters/ToParam"
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Audit rows, newest first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditLog"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/field-units:
    post:
      tags:
        - Assignments and Field Units
      operationId: createFieldUnit
      summary: "[Proposed, no SRS FR] Create a field unit"
      description: |-
        Adds a unit that Field Unit Representatives can be linked to (`users.field_unit_id`). Audited. `field_unit.manage` is a new code introduced by D-37 and must be seeded like the other approved codes.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `field_unit.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        > **Proposed / optional operation** - not required by the SRS; approve or remove (see API_DESIGN_DECISIONS.md).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - field_unit.manage
      x-fr: []
      x-entities:
        - field_units
        - audit_logs
      x-mechanism: endpoint
      x-proposed: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFieldUnitRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/field-units/{fieldUnitId}:
    patch:
      tags:
        - Assignments and Field Units
      operationId: updateFieldUnit
      summary: "[Proposed, no SRS FR] Update a field unit"
      description: |-
        Updates name, type, availability or location. There is no delete operation (users and assignments reference units). Emits `field_unit.updated`. Audited.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `field_unit.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        > **Proposed / optional operation** - not required by the SRS; approve or remove (see API_DESIGN_DECISIONS.md).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - field_unit.manage
      x-fr: []
      x-entities:
        - field_units
        - audit_logs
      x-mechanism: endpoint
      x-proposed: true
      parameters:
        - $ref: "#/components/parameters/FieldUnitIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFieldUnitAdminRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldUnit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/permissions:
    get:
      tags:
        - Roles and Permissions
      operationId: listPermissions
      summary: "[FR-004] List all permission codes"
      description: |-
        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `role.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - role.manage
      x-fr:
        - FR-004
      x-entities:
        - permissions
      x-mechanism: endpoint
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Permission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/report-types:
    post:
      tags:
        - Report Types
      operationId: createReportType
      summary: "[FR-036, FR-008] Create a report type"
      description: |-
        Adds a type under a category. `(category, name)` is unique. Audited. The seeded SOS type cannot be renamed or recategorised (409 `protected_report_type`), because D-25 identifies it by name.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `settings.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - settings.manage
      x-fr:
        - FR-036
        - FR-008
      x-entities:
        - report_types
        - audit_logs
      x-mechanism: endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportTypeRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/report-types/{reportTypeId}:
    patch:
      tags:
        - Report Types
      operationId: updateReportType
      summary: "[FR-036, FR-008] Update a report type or its authority"
      description: |-
        No delete operation exists because `reports.report_type_id` references the table and the ERD has no soft-delete flag (D-31).

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `settings.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - settings.manage
      x-fr:
        - FR-036
        - FR-008
      x-entities:
        - report_types
        - audit_logs
      x-mechanism: endpoint
      parameters:
        - $ref: "#/components/parameters/ReportTypeIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportTypeRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/reports/{reportId}/reporter-identity/reveal:
    post:
      tags:
        - Anonymous Identity Disclosure
      operationId: revealAnonymousReporterIdentity
      summary: "[FR-037, FR-009] Reveal the identity of an anonymous reporter"
      description: |-
        The ONLY operation that returns an anonymous reporter's identity. A mandatory `reason` is required. In one transaction the backend writes an `audit_logs` row (`action = identity.reveal`, `actor_id`, `entity_type = report`, `entity_id`, `reason`, `ip_address`, timestamp) and returns the identity; if the audit write fails nothing is returned. Not available to any other role. Non-anonymous reports return 409 `report_not_anonymous`. Responses are `Cache-Control: no-store`. Attempts that fail authorisation or validation are logged too (recommended, D-29). POST (not GET) because it has an audited side effect.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `identity.reveal`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        **Privacy**
        - Sensitive response. Never logged in application logs, never exported, never pushed through real-time channels.

        **State synchronisation**
        - Audit row and disclosure succeed or fail together.
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - identity.reveal
      x-fr:
        - FR-037
        - FR-009
      x-nfr:
        - NFR-010
        - NFR-013
        - NFR-016
      x-entities:
        - reports
        - users
        - audit_logs
      x-mechanism: endpoint
      x-rate-limited: true
      parameters:
        - $ref: "#/components/parameters/ReportIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevealIdentityRequest"
      responses:
        "200":
          description: Identity revealed and audited.
          headers:
            Cache-Control:
              description: no-store
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevealedIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/roles:
    get:
      tags:
        - Roles and Permissions
      operationId: listRoles
      summary: "[FR-004] List roles with their permissions"
      description: |-
        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `role.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - role.manage
      x-fr:
        - FR-004
      x-entities:
        - roles
        - permissions
        - role_permissions
      x-mechanism: endpoint
      responses:
        "200":
          description: The four official roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/roles/{roleId}/permissions:
    put:
      tags:
        - Roles and Permissions
      operationId: replaceRolePermissions
      summary: "[FR-004] Replace the permission set of a role"
      description: |-
        Replaces the `role_permissions` rows of the role in one transaction. Roles themselves are fixed (the four official roles); creating or deleting roles is out of scope. Takes effect on the next request without code changes. Audited.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `role.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        **Privacy**
        - Removing `identity.reveal` from System Administrator disables FR-037; this is allowed but audited (D-08).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - role.manage
      x-fr:
        - FR-004
      x-entities:
        - role_permissions
        - permissions
        - roles
        - audit_logs
      x-mechanism: endpoint
      parameters:
        - $ref: "#/components/parameters/RoleIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceRolePermissionsRequest"
      responses:
        "200":
          description: Updated role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/settings:
    get:
      tags:
        - System Settings
      operationId: listSettings
      summary: "[FR-036] List system settings"
      description: |-
        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `settings.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - settings.manage
      x-fr:
        - FR-036
      x-entities:
        - system_settings
      x-mechanism: endpoint
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Setting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/settings/{key}:
    put:
      tags:
        - System Settings
      operationId: updateSetting
      summary: "[FR-036] Update a setting value"
      description: |-
        Updates `system_settings.value` (for example the SOS cancellation countdown, default 5 seconds). Every change is audited with old and new value. Unknown keys return 404 (keys are seeded; creating arbitrary keys is not allowed).

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `settings.manage`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - settings.manage
      x-fr:
        - FR-036
      x-entities:
        - system_settings
        - audit_logs
      x-mechanism: endpoint
      parameters:
        - $ref: "#/components/parameters/SettingKeyPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"
  /admin/simulated-integration-logs:
    get:
      tags:
        - Simulated Integration
      operationId: listSimulatedIntegrationLogs
      summary: "[FR-039] View the simulated authority exchange log"
      description: |-
        The simulation layer itself is internal: on assignment the backend sends the operator-projected report to the simulated authority, receives a canned reply and stores one `simulated_integration_logs` row. This read-only endpoint is optional.

        **Authorization**
        - Authentication required (Bearer JWT).
        - Allowed roles: System Administrator.
        - Required permission codes (checked against `role_permissions`): `audit.view`.
        - Enforced on the backend; the frontend is never trusted (NFR-007).

        > **Proposed / optional operation** - not required by the SRS; approve or remove (see API_DESIGN_DECISIONS.md).
      x-required-roles:
        - System Administrator
      x-required-permissions:
        - audit.view
      x-fr:
        - FR-039
      x-entities:
        - simulated_integration_logs
      x-mechanism: internal service (+ optional read endpoint)
      x-proposed: true
      parameters:
        - name: assignment_id
          in: query
          required: false
          description: Filter by assignment.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PerPageParam"
      responses:
        "200":
          description: Log rows.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:

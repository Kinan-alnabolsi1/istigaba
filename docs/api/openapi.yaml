          properties:
            role:
              type: string
              enum:
                - citizen
                - dispatcher
            display_name:
              type: string
              description:
                '"Anonymous Reporter" for the citizen when the report is anonymous; otherwise the real name. No
                user id is exposed.'
        message:
          type: string
        sent_at:
          type: string
          format: date-time
    SendChatMessageRequest:
      type: object
      required:
        - message
      additionalProperties: false
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: Max length is a proposal (D-27).
    FieldAssignmentSummary:
      type: object
      required:
        - id
        - report_id
        - mission_status
        - assigned_at
        - report
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        mission_status:
          $ref: "#/components/schemas/MissionStatus"
        assigned_at:
          type: string
          format: date-time
        report:
          type: object
          required:
            - report_type
            - severity
            - status
          properties:
            report_type:
              $ref: "#/components/schemas/ReportTypeRef"
            severity:
              oneOf:
                - $ref: "#/components/schemas/SeverityLevel"
                - type: "null"
            status:
              $ref: "#/components/schemas/ReportStatus"
            location_text:
              type:
                - string
                - "null"
            location:
              oneOf:
                - $ref: "#/components/schemas/GeoPoint"
                - type: "null"
    FieldAssignment:
      description:
        Field-unit view of an assignment of the caller's own unit. Contains no chat, no AI extraction, no timeline
        notes and no reporter identity for anonymous reports.
      allOf:
        - $ref: "#/components/schemas/FieldAssignmentSummary"
        - type: object
          required:

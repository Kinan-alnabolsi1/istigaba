[project]
name = "istigaba-ai-service"
version = "0.1.0"
description = "Istigaba AI service: speech-to-text and report extraction (internal, 127.0.0.1 only)."
requires-python = ">=3.13,<3.14"
# Exact versions are pinned in requirements.lock / requirements-dev.lock (pip-compile --generate-hashes).
# ML dependencies (faster-whisper, transformers/AraBERT) arrive in S8.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic-settings==2.16.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pip-tools==7.7.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "T20", "PL", "PT", "ASYNC"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["app", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
